name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install Pillow (image optimization and APK checks)
        # zopfli e opcional: sem ele o script recomprime com zlib nivel 9 (arquivos um pouco maiores)
        run: |
          python3 -m pip install --quiet pillow==12.3.0 numpy
          python3 -m pip install --quiet zopfli || echo '::warning::zopfli indisponivel; usando zlib'

      - name: Build web app
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon and splash screen
        # Fontes: assets/native/*.png (mestres) -> mipmap/drawable do projeto android/; splash do Android 12+; otimizacao dos PNGs
        run: npm run assets:android

      - name: Verify native resources
        run: node scripts/verify-android-resources.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify icon and splash inside the APK
        run: |
          AAPT2="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 | sort -V | tail -1)"
          echo "aapt2: $AAPT2"
          python3 scripts/verify-apk-icons.py android/app/build/outputs/apk/debug/app-debug.apk "$AAPT2"

      - name: Report APK size
        run: python3 scripts/report-apk-size.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GasTrack-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
