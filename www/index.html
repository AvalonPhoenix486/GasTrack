<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GasTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-busy="false">
    <h1>GasTrack</h1>
    <p id="notice" class="notice" role="status" hidden></p>
    <p id="message" class="error" role="alert" hidden></p>
    <p id="success" class="success" role="status" hidden></p>

    <section aria-labelledby="current-title">
      <h2 id="current-title">Ciclo atual</h2>
      <p id="current-status"></p>
      <form id="start-form" class="date-form" hidden>
        <label for="start-date">Data de início</label>
        <input id="start-date" type="date" required>
        <button id="start-button" class="primary" type="submit">Iniciar ciclo</button>
      </form>
      <form id="end-form" class="date-form" hidden>
        <label for="end-date">Data de encerramento</label>
        <input id="end-date" type="date" required>
        <button id="end-button" class="primary" type="submit">Encerrar ciclo</button>
      </form>
      <div id="open-actions"></div>
    </section>

    <section id="forecast" class="card" aria-live="polite"></section>
    <p class="hint">A previsão é uma estimativa estatística, não uma garantia.</p>

    <section aria-labelledby="history-title">
      <h2 id="history-title">Histórico</h2>
      <p id="history-empty" hidden></p>
      <ol id="history-list"></ol>
    </section>
  </main>
  <script type="module" src="js/app/main.js"></script>
</body>
</html>
