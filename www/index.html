<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#490038">
  <title>GasTrack</title>
  <link rel="icon" type="image/svg+xml" href="crystal.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" aria-busy="false">
    <header class="topbar" id="topbar">
      <h1 class="brand" id="brand">GasTrack</h1>
      <button id="theme-button" class="icon-button" type="button"></button>
    </header>
    <p id="notice" class="banner banner-warn" role="status" hidden></p>
    <main id="view" tabindex="-1"></main>
    <nav id="tabs" class="tabbar" aria-label="Navegação principal"></nav>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <div id="sheet-root"></div>
  <div id="splash" class="splash" aria-hidden="true"></div>
  <script type="module" src="js/app/main.js"></script>
</body>
</html>
